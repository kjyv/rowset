name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version

      # The Xcode project is not in git. XcodeGen writes it from project.yml, and the script
      # installs XcodeGen if the runner has none.
      - name: Generate the project
        run: ./Scripts/bootstrap.sh

      - name: Test
        run: |
          xcodebuild -project Rowset.xcodeproj \
            -scheme Rowset \
            -destination 'platform=macOS' \
            -only-testing:RowsetTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build application
        run: |
          xcodebuild -project Rowset.xcodeproj \
            -scheme Rowset \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          mkdir -p dmg-contents
          cp -R build/Build/Products/Release/Rowset.app dmg-contents/
          ln -s /Applications dmg-contents/Applications

          hdiutil create -volname "Rowset" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            Rowset.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Rowset.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
